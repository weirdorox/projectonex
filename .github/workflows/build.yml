name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Core + data tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Lumen.Core.Tests/Lumen.Core.Tests.csproj -c Release
      - run: dotnet test tests/Lumen.Data.Tests/Lumen.Data.Tests.csproj -c Release

  windows:
    name: Windows build, tests, publish, installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests
        shell: pwsh
        run: |
          dotnet test tests/Lumen.Core.Tests/Lumen.Core.Tests.csproj -c Release
          dotnet test tests/Lumen.Data.Tests/Lumen.Data.Tests.csproj -c Release

      - name: Build (Debug, x64)
        shell: pwsh
        run: ./scripts/build.ps1 -SkipTests

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Publish + installer
        shell: pwsh
        run: ./scripts/publish.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-x64
          path: |
            artifacts/installer/*.exe
            artifacts/publish/Lumen/**
