name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Core + data tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Lumen.Core.Tests/Lumen.Core.Tests.csproj -c Release
      - run: dotnet test tests/Lumen.Data.Tests/Lumen.Data.Tests.csproj -c Release

  windows:
    name: Windows build, tests, publish, installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests
        shell: pwsh
        run: |
          dotnet test tests/Lumen.Core.Tests/Lumen.Core.Tests.csproj -c Release
          dotnet test tests/Lumen.Data.Tests/Lumen.Data.Tests.csproj -c Release

      - name: Build (Debug, x64)
        shell: pwsh
        run: ./scripts/build.ps1 -SkipTests

      - name: Show XAML compiler diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem src/Lumen.App/obj -Recurse -Filter output.json | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName }
          $in = Get-ChildItem src/Lumen.App/obj -Recurse -Filter input.json | Select-Object -First 1
          $xc = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk.winui" -Recurse -Filter XamlCompiler.exe | Where-Object { $_.FullName -match 'net472' } | Select-Object -First 1
          if ($in -and $xc) {
            Write-Host "== Running $($xc.FullName) directly"
            Push-Location src/Lumen.App
            & $xc.FullName $in.FullName "$($in.DirectoryName)\output.json" 2>&1 | Out-Host
            Write-Host "exit code: $LASTEXITCODE"
            if (Test-Path "$($in.DirectoryName)\output.json") { Get-Content "$($in.DirectoryName)\output.json" }
            Pop-Location
          }
          Write-Host "== Full MSBuild (Visual Studio) build for detailed XAML errors"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if ($vs) { & $vs src/Lumen.App/Lumen.App.csproj /restore /p:Configuration=Debug /p:Platform=x64 /v:minimal /nologo 2>&1 | Out-Host }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Fetch PresentMon (FPS telemetry, MIT licensed)
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force third_party/presentmon | Out-Null
          gh release download --repo GameTechDev/PresentMon --pattern 'PresentMon-*-x64.exe' --dir third_party/presentmon --clobber
          gh api repos/GameTechDev/PresentMon/contents/LICENSE.txt -H "Accept: application/vnd.github.raw" > third_party/presentmon/LICENSE.txt
          $exe = Get-ChildItem third_party/presentmon -Filter 'PresentMon-*-x64.exe' | Select-Object -First 1
          if ($exe) {
            "LUMEN_PRESENTMON=$($exe.FullName)" >> $env:GITHUB_ENV
            Write-Host "PresentMon: $($exe.Name)"
            $sig = Get-AuthenticodeSignature $exe.FullName
            Write-Host "Signature: $($sig.Status) / $($sig.SignerCertificate.Subject)"
          } else { Write-Warning "PresentMon release asset not found" }

      - name: Publish + installer
        shell: pwsh
        run: ./scripts/publish.ps1

      - name: Start-up smoke test (published build)
        shell: pwsh
        run: |
          $exe = Resolve-Path artifacts/publish/Lumen/Lumen.exe
          $logs = Join-Path $env:LOCALAPPDATA 'Lumen/logs'
          $env:LUMEN_SMOKE_UI = '1'
          $p = Start-Process $exe -ArgumentList '--windowed' -PassThru
          Start-Sleep -Seconds 30
          $alive = -not $p.HasExited
          Write-Host "Lumen alive after 25 s: $alive (exit code: $(if ($p.HasExited) { $p.ExitCode } else { '-' }))"
          if (Test-Path $logs) { Get-ChildItem $logs | Sort-Object LastWriteTime | ForEach-Object { Write-Host "---- $($_.Name)"; Get-Content $_.FullName -Tail 200 } }
          else { Write-Host "No log folder at $logs" }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-3) } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in 'Application Error', '.NET Runtime', 'Windows Error Reporting' } |
            ForEach-Object { Write-Host "==== $($_.ProviderName) $($_.TimeCreated)"; Write-Host $_.Message }
          if ($alive) { Stop-Process -Id $p.Id -Force }
          if (-not $alive) { throw "Lumen exited during start-up" }
          $log = Get-ChildItem $logs | Sort-Object LastWriteTime | Select-Object -Last 1
          if ((Get-Content $log.FullName -Raw) -match 'Unhandled UI exception|Quick access failed') { throw "UI exception during the smoke walk" }
          if ((Get-Content $log.FullName -Raw) -notmatch '\[smoke\] UI walk finished') { throw "UI smoke walk did not finish" }

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-x64
          path: |
            artifacts/installer/*.exe
            artifacts/publish/Lumen/**
